name: Production Stability & Drift Guard
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt || true
      - run: pytest -q
      - run: python3 scripts/day2_drift_monitor.py
      - run: python3 scripts/ops_autonomous_maintenance.py
