name: Production Stability & Drift Guard
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'
jobs:
  verify:
    runs-on: macos-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python Dependencies
        run: pip install -r requirements.txt
      - name: Prepare Test Fixtures
        run: python3 scripts/setup_ci_databases.py
      - name: Run Pytest Regression Suite
        run: |
          python3 -m pytest -ra --tb=short 2>&1 | tee pytest.log || {
            echo "::error::Pytest failed. Dumping short summary:"
            grep -E "FAILED|ERROR" pytest.log || cat pytest.log
            exit 1
          }
      - name: Execute SQLite WASM Runtime Harness
        run: node scripts/test_wasm_node_runner.js
      - name: Run Day 2 Drift Monitor
        run: python3 scripts/day2_drift_monitor.py
      - name: Run Autonomous Maintenance Engine
        run: python3 scripts/ops_autonomous_maintenance.py
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Container Image
        run: docker build -t lexical-explorer:ci-test -f Dockerfile .
